services:
  mysql:
    image: mysql:8.0
    container_name: kairon_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: kairon_dev
      MYSQL_USER: kairon
      MYSQL_PASSWORD: kairon123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Base nueva: el esquema ya incluye responsables de sucursal, solicitudes, archivo de sesión,
      # fecha en sesion_insumo y la restricción terapeuta-sucursal. Solo faltan estas migraciones.
      - ./schema_mysql.sql:/docker-entrypoint-initdb.d/00_schema.sql
      - ./scripts/migrate-responsables-empresa.sql:/docker-entrypoint-initdb.d/01_migrate-responsables-empresa.sql
      - ./scripts/migrate-sesion-observaciones.sql:/docker-entrypoint-initdb.d/02_migrate-sesion-observaciones.sql
      - ./scripts/migrate-ficha-trabajador.sql:/docker-entrypoint-initdb.d/03_migrate-ficha-trabajador.sql
      - ./scripts/migrate-contactos-emergencia.sql:/docker-entrypoint-initdb.d/04_migrate-contactos.sql
      - ./scripts/migrate-sesion-flags.sql:/docker-entrypoint-initdb.d/05_migrate-sesion-flags.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
